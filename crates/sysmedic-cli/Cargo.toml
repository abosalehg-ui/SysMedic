[package]
name = "sysmedic-cli"
description = "SysMedic command-line interface: checkup, reports and explanations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sysmedic"
path = "src/main.rs"

[dependencies]
sysmedic-core = { workspace = true }
sysmedic-collectors = { workspace = true }
sysmedic-diagnostics = { workspace = true }
sysmedic-knowledge = { workspace = true }
sysmedic-report = { workspace = true }
sysmedic-fixes = { workspace = true }
sysmedic-diskscan = { workspace = true }
sysmedic-history = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
owo-colors = { workspace = true }

[dev-dependencies]
# The end-to-end tests run the built binary and assert on its JSON output and
# rule list, so they need to parse JSON and to see the declared rule set.
serde_json = { workspace = true }
sysmedic-diagnostics = { workspace = true }
