[package]
name = "sysmedic-gui"
description = "SysMedic GTK4/libadwaita desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sysmedic-gui"
path = "src/main.rs"

[dependencies]
sysmedic-core = { workspace = true }
sysmedic-collectors = { workspace = true }
sysmedic-diagnostics = { workspace = true }
sysmedic-knowledge = { workspace = true }
sysmedic-fixes = { workspace = true }
sysmedic-diskscan = { workspace = true }
sysmedic-history = { workspace = true }
sysmedic-report = { workspace = true }
gtk = { package = "gtk4", version = "0.9", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
# The treemap draws its own labels. cairo's toy text API has no shaping and
# no bidi, so Arabic folder names came out as disconnected, reversed glyphs;
# Pango lays them out properly (and ellipsizes long ones).
pangocairo = "0.22"

[dev-dependencies]
tempfile = "3"
