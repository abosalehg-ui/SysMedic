version: 2

# Updates are batched: one PR per group per month, so they never pile up and
# go stale against main. Majors are split out because they are the ones that
# can break the build.
updates:
  # Keep GitHub Actions up to date. Together with pinning actions to commit
  # SHAs, this is the sustainable defense against a compromised action release.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  # Surface Cargo advisories (e.g. RUSTSEC) and keep the lockfile current.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: deps
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      major:
        patterns: ["*"]
        update-types: ["major"]
