name: Pages

# Publish the static landing page (docs/site) to GitHub Pages. Enable Pages with
# "GitHub Actions" as the source in the repository settings for this to deploy.
on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "docs/screenshots/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assemble site (index + screenshots at the root)
        run: |
          mkdir -p _site/screenshots
          cp docs/site/*.html _site/
          cp docs/screenshots/*.png _site/screenshots/
      # Pages must be enabled once by hand: Settings → Pages → Source:
      # GitHub Actions (creating the site via API needs an `administration`
      # permission GITHUB_TOKEN can never hold).
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
