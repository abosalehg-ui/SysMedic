name: Pages

# Publish the static landing page (docs/site) to GitHub Pages. Enable Pages with
# "GitHub Actions" as the source in the repository settings for this to deploy.
on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "docs/screenshots/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Assemble site (index + screenshots at the root)
        run: |
          mkdir -p _site/screenshots
          cp docs/site/index.html _site/index.html
          cp docs/screenshots/*.png _site/screenshots/
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
