name: Release

# Build distributable artifacts when a v* tag is pushed, and attach them to the
# GitHub release. Also runnable on demand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Scoped per job below rather than granted to the whole file: only the release
# upload needs write, and the attestation needs its own two.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  deb:
    name: Build .deb (+ AppDir)
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach artifacts to the release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install GTK4/libadwaita dev libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      # Pinned to a commit of the `stable` branch; toolchain selected via input.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - name: Build release binaries
        run: cargo build --release --locked -p sysmedic-cli -p sysmedic-fix-helper -p sysmedic-gui
      - name: Build .deb
        run: packaging/deb/build-deb.sh
      - name: Assemble AppDir
        run: packaging/appimage/build-appimage.sh || true
      # This package installs two helpers that run as root through polkit, so
      # whoever downloads it should be able to tell that what they got is what
      # this workflow built. Checksums cover a corrupted or swapped file;
      # the attestation ties the artifact to this repository, workflow and
      # commit, and `gh attestation verify` checks it.
      - name: Checksums
        run: sha256sum sysmedic_*.deb | tee SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sysmedic_*.deb
      - name: Upload .deb artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sysmedic-deb
          path: |
            sysmedic_*.deb
            SHA256SUMS
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            sysmedic_*.deb
            SHA256SUMS
          draft: true
          generate_release_notes: true
