name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so pushes to a PR don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The default GITHUB_TOKEN can be repo-writable; CI only needs to read code.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install GTK4/libadwaita dev libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      # Pinned to a commit of the `stable` branch; the toolchain is selected via
      # the input (a SHA ref no longer encodes it the way `@stable` did).
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Build CLI + fix helper (release)
        run: cargo build --release --locked -p sysmedic-cli -p sysmedic-fix-helper
      - name: Smoke-run checkup
        run: ./target/release/sysmedic checkup --format json | head -c 2000
      - name: Smoke-run fix listing
        run: ./target/release/sysmedic fix
      - name: Smoke-run advanced tools
        run: |
          ./target/release/sysmedic disk . --depth 1 --top 5
          ./target/release/sysmedic network
      - name: Smoke-run follow-up tools
        run: |
          ./target/release/sysmedic monitor --quiet
          ./target/release/sysmedic history
          ./target/release/sysmedic schedule status
      - name: Smoke-run deep-explain fallback (no API key -> offline answer)
        run: ./target/release/sysmedic explain storage.disk_nearly_full --deep
      - name: Build & verify the .deb
        run: |
          cargo build --release -p sysmedic-gui
          packaging/deb/build-deb.sh
          dpkg-deb --info sysmedic_*.deb
          dpkg-deb --contents sysmedic_*.deb | grep -q usr/bin/sysmedic

  # Fail the build on known RUSTSEC advisories in Cargo.lock. Dependabot keeps
  # dependencies fresh; this gate catches an advisory landing between updates —
  # which matters for a binary that runs privileged fixes.
  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
