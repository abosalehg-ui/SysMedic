[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/abosalehg-ui/SysMedic"
homepage = "https://github.com/abosalehg-ui/SysMedic"
authors = ["abosalehg-ui <ar0.history@gmail.com>"]

[workspace.dependencies]
sysmedic-core = { path = "crates/sysmedic-core" }
sysmedic-collectors = { path = "crates/sysmedic-collectors" }
sysmedic-diagnostics = { path = "crates/sysmedic-diagnostics" }
sysmedic-knowledge = { path = "crates/sysmedic-knowledge" }
sysmedic-fixes = { path = "crates/sysmedic-fixes" }
sysmedic-report = { path = "crates/sysmedic-report" }
sysmedic-diskscan = { path = "crates/sysmedic-diskscan" }
sysmedic-history = { path = "crates/sysmedic-history" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml 0.9 was archived by its author ("+deprecated" is in the version
# string itself), so it will never receive a fix. serde_yaml_ng is the
# maintained continuation with the same API. The other common suggestion,
# serde_yml, is itself now marked deprecated on crates.io.
serde_yaml_ng = "0.10"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
owo-colors = { version = "4", features = ["supports-colors"] }
humantime = "2"
once_cell = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
lto = "thin"
strip = true
